set -g @catppuccin_flavor 'mocha'
run -b '~/.tmux/plugins/tmux/catppuccin.tmux'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # Tmux Sensible defaults
set -g @plugin 'catppuccin/tmux#v2.1.2' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'tmux-plugins/tmux-resurrect' # Restore tmux environment after system restart
set -g @plugin 'tmux-plugins/tmux-continuum' # continuous saving of tmux environment, auto start and restore (relies on the save state of resurrect)
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g mouse on

# Ensure modern terminal capabilities and UTF-8 glyph rendering
set -g default-terminal "tmux-256color"
# Enable truecolor in common terminals
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc,screen-256color:Tc"
# Copies go to the outer terminal's clipboard via OSC52, so copying in tmux
# on a remote host over SSH lands on the local Mac
set -g set-clipboard on
# Let programs in panes pass escape sequences through to the outer terminal
set-option -g allow-passthrough on
# Never propagate FPATH to new panes: a stale exported FPATH (e.g. after a
# Homebrew zsh upgrade removes the old Cellar path) breaks zsh autoloads
set-environment -g -u FPATH

# change prefix to Ctrl+a
set -s escape-time 0
set -g base-index 1

set -g prefix C-a
unbind C-b

# Resurrect and Continuum settings
set -g @continuum-restore 'on'              # Auto-restore sessions on tmux start
set -g @continuum-boot 'on'                 # Auto-start tmux on system boot (optional)
set -g @continuum-save-interval '15'        # Save every 15 minutes (default)
set -g @resurrect-capture-pane-contents 'off' # Don't write pane text (and any secrets in it) to disk

# Vim-like copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi p send-keys -X paste-buffer
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# Copy recent command output without scrolling. .zshrc marks where each
# command's output starts (OSC 133;C) and previous-prompt -o jumps to that
# mark. The two cursor-ups skip the blank line starship's add_newline puts
# above the prompt; the cursor-down keeps a one-line output's own mark in
# reach, since the jump only searches lines above the cursor. The copy goes
# through load-buffer -w because tmux drops the OSC52 write while the pane
# still has the copy-mode redraw pending, so a plain copy-selection-and-cancel
# here would fill the tmux buffer but never reach the clipboard.
#   prefix y: last command's output
#   prefix Y: last command line plus its output
#   [ / ] in copy mode: jump to the previous / next command's output
bind -N "Copy the last command's output" y copy-mode \; send-keys -X cursor-up \; send-keys -X cursor-up \; send-keys -X end-of-line \; send-keys -X begin-selection \; send-keys -X cursor-down \; send-keys -X previous-prompt -o \; send-keys -X pipe-and-cancel "tmux load-buffer -w -"
bind -N "Copy the last command and its output" Y copy-mode \; send-keys -X cursor-up \; send-keys -X cursor-up \; send-keys -X end-of-line \; send-keys -X begin-selection \; send-keys -X cursor-down \; send-keys -X previous-prompt -o \; send-keys -X cursor-up \; send-keys -X start-of-line \; send-keys -X pipe-and-cancel "tmux load-buffer -w -"
bind -T copy-mode-vi [ send-keys -X previous-prompt -o
bind -T copy-mode-vi ] send-keys -X next-prompt -o

bind -N "Pane left" -r h select-pane -L
bind -N "Pane down" -r j select-pane -D
bind -N "Pane up" -r k select-pane -U
bind -N "Pane right" -r l select-pane -R

bind-key -N "Open a project (sessionizer)" -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -N "SSH to a host (sessionizer)" -r r run-shell "tmux neww ~/.local/bin/tmux-ssh-sessionizer"
# find-in-files; on g so it doesn't override prefix+j (pane down) above
bind-key -N "Find in files" g run-shell "tmux neww 'zsh -ic fif'"
bind-key -N "Jump to the dotfiles session" -r D run-shell "~/.local/bin/tmux-sessionizer ~/.dotfiles"
bind-key -N "Sync dotfiles now (dotsync)" u display-popup -E -w 80% -h 50% -T " dotsync " "bash -c '~/.local/bin/dotsync; read -rsn1 -p \"press any key to close\"'"
# prefix ?: fuzzy-searchable key help (every binding with a -N note, these
# included), minus keys I already know: window numbers and s. Esc closes.
bind -N "Search key bindings" ? display-popup -E -w 80% -h 80% -T " keys " "tmux list-keys -N | grep -vE '^C-a ([0-9]|s) ' | fzf --reverse --no-sort --prompt 'keys> '"

# Automatically renumber windows when one is closed
set -g renumber-windows on

# General statusline customisation
set -g status-bg default
set -g status-style fg=default,bg=default
set-option -g status-style bg=default

# status left style
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# status right style
set -g status-right-length 100
set -g status-right ""
# Empty unless ~/.dotfiles needs attention (behind, unpushed, uncommitted, unlinked)
set -ga status-right "#(~/.local/bin/dotfiles-status --tmux)"
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_mantle}]},#{#[bg=#{@thm_mantle},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_mantle}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags ""
set -g @catppuccin_window_number ""
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W ,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W ,}"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"


# Load TPM (add this line at the end of your .tmux.conf file)
run '~/.tmux/plugins/tpm/tpm'
